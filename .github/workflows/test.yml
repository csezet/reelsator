name: test-windows

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
      - name: Install official CAI c2patool for external validation
        shell: pwsh
        run: |
          python -c "import urllib.request, zipfile, io, os; url = 'https://github.com/contentauth/c2patool/releases/download/v0.9.12/c2patool-v0.9.12-x86_64-pc-windows-msvc.zip'; dest = os.path.join(os.environ['TEMP'], 'c2patool_extracted'); os.makedirs(dest, exist_ok=True); resp = urllib.request.urlopen(url); z = zipfile.ZipFile(io.BytesIO(resp.read())); z.extractall(dest); print('c2patool extracted successfully')"
          "$env:TEMP\c2patool_extracted\c2patool" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run unit and integration tests
        run: python -m unittest discover tests -v

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies from lockfiles
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev-lock.txt
      - name: Build executable with PyInstaller
        run: python build_exe.py
      - name: Verify build artifact smoke check
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Reelsator/Reelsator.exe")) {
            Write-Error "dist/Reelsator/Reelsator.exe does not exist"
            exit 1
          }
          $size = (Get-Item "dist/Reelsator/Reelsator.exe").Length
          if ($size -le 1000000) {
            Write-Error "dist/Reelsator/Reelsator.exe is unexpectedly small: $size bytes"
            exit 1
          }
          Write-Host "Build verification passed! Artifact size: $([math]::Round($size/1MB, 2)) MB"
