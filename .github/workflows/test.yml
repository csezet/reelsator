name: test-windows

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      - name: Run unit and integration tests
        run: python -m unittest discover tests -v

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies from lockfiles
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -r requirements-dev-lock.txt
      - name: Build executable with PyInstaller
        run: python build_exe.py
      - name: Verify build artifact smoke check
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Reelsator/Reelsator.exe")) {
            Write-Error "dist/Reelsator/Reelsator.exe does not exist"
            exit 1
          }
          $size = (Get-Item "dist/Reelsator/Reelsator.exe").Length
          if ($size -le 1000000) {
            Write-Error "dist/Reelsator/Reelsator.exe is unexpectedly small: $size bytes"
            exit 1
          }
          Write-Host "Build verification passed! Artifact size: $([math]::Round($size/1MB, 2)) MB"
